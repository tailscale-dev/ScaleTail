name: Test scripts
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: ['scripts/**', '.github/workflows/scripts.yml']
  pull_request:
    branches:
      - main
    paths: ['scripts/**', '.github/workflows/scripts.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Run the update script tests
        run: bash scripts/test-update-stack.sh
