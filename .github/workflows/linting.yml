name: Perform markdown linting
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependabot bumps the action's SHA but not the version input. Fail until
      # both name the same rumdl version.
      - name: Check that the rumdl version matches the pinned action
        run: |
          f=.github/workflows/linting.yml
          action=$(grep -oE 'rvben/rumdl@[0-9a-f]{40} # v[0-9.]+' "$f" | sed 's/.*# v//')
          input=$(grep -oE 'version: "[0-9.]+"' "$f" | grep -oE '[0-9.]+')
          if [ -z "$action" ] || [ "$action" != "$input" ]; then
            echo "::error file=$f::rvben/rumdl is pinned to v${action:-?} but installs rumdl ${input:-?}. Set version: \"${action}\"."
            exit 1
          fi

      # rumdl checks that each link target exists. This step enforces the link
      # style of CONTRIBUTING.md: paths from the repository root, not ../ or
      # github.com/.../blob/main. Files in .github/ keep full URLs.
      - name: Check the link style
        run: |
          pattern='\]\((\.\.?/|[A-Za-z0-9_-][^:)[:space:]]*\))|tailscale-dev/ScaleTail/(blob|tree)/main'
          if git ls-files -z '*.md' ':!.github/*' | xargs -0 grep -n -E "$pattern"; then
            echo "::error::Link to repository files with a path from the repository root, such as /documentation/standard-setup.md. See CONTRIBUTING.md, 'Link in Markdown'."
            exit 1
          fi

      - name: Lint Markdown
        uses: rvben/rumdl@19006897519812a2fdc508314b34738e5c281233 # v0.3.0
        with:
          version: "0.3.0" # Keep in line with the pinned action above
          path: "."
          config: ".markdownlint.yml"
          report-type: annotations
