name: ⚡️ Feature Request
description: Suggest a new feature or enhancement for ScaleTail
title: '⚡️ Feature: '
type: 'Feature'
labels: "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a change to the Tailscale sidecar or its environment variables, for an improvement to an existing service, or for a documentation request.

        To request a new service, use the **New Service Request** form. To report something that is broken, use the **Bug Report** form.

        **Before you start:**
        Please check if the feature has already been requested by searching [existing feature requests](https://github.com/tailscale-dev/ScaleTail/issues?q=label%3Aenhancement).

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What does this request change?
      options:
        - Tailscale sidecar or environment variables
        - An existing service
        - Documentation
        - Something else
    validations:
      required: true

  - type: input
    id: service
    attributes:
      label: Service
      description: The directory name under `services/`, when the request is about one service.
      placeholder: immich
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like to see implemented.
      placeholder: I would like to see...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem It Solves
      description: Explain what problem this feature solves or what need it addresses.
      placeholder: This would help with...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
      placeholder: I think this could work by...
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to work on this feature?
      options:
        - Yes, I'd like to implement this feature
        - I could help with parts of this feature
        - No, I'm just suggesting the feature
    validations:
      required: true
