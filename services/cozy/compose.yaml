configs:
  # Serve configuration of the main device: the instance itself (login and API).
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8080"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}
  # Serve configuration of the app devices: forwards to cozy-stack in the network of the main device.
  ts-serve-app:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://tailscale:8080"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}
  # cozy-stack configuration. The {{.Env.X}} values are read by cozy-stack at start from the environment of the application.
  cozy-config:
    content: |
      host: 0.0.0.0
      port: 8080
      admin:
        host: 127.0.0.1
        port: 6060
      subdomains: flat
      couchdb:
        url: {{.Env.COUCHDB_PROTOCOL}}://{{.Env.COUCHDB_USER}}:{{.Env.COUCHDB_PASSWORD}}@{{.Env.COUCHDB_HOST}}:{{.Env.COUCHDB_PORT}}
      fs:
        url: file:///var/lib/cozy/data
      vault:
        credentials_encryptor_key: /etc/cozy/vault.enc
        credentials_decryptor_key: /etc/cozy/vault.dec
      konnectors:
        cmd: /usr/local/bin/konnector-node-run.sh
      log:
        level: info
        syslog: false
      registries:
        default:
          - https://apps-registry.cozycloud.cc/selfhosted
          - https://apps-registry.cozycloud.cc/mespapiers
          - https://apps-registry.cozycloud.cc/banks
          - https://apps-registry.cozycloud.cc/

# Settings shared by the Tailscale devices of the apps. Each app needs its own device,
# because cozy-stack serves every app on its own host name.
x-tailscale-app: &tailscale-app
  image: tailscale/tailscale:latest # Image to be used
  environment:
    - TS_AUTHKEY=${TS_AUTHKEY}
    - TS_STATE_DIR=/var/lib/tailscale
    - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the app on your local Tailnet
    - TS_USERSPACE=false
    - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
    - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
    - TS_AUTH_ONCE=true
  configs:
    - source: ts-serve-app
      target: /config/serve.json
  devices:
    - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
  cap_add:
    - net_admin # Tailscale requirement
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
    interval: 1m # How often to perform the check
    timeout: 10s # Time to wait for the check to succeed
    retries: 3 # Number of retries before marking as unhealthy
    start_period: 10s # Time to wait before starting health checks
  restart: always

services:
# Make sure you have updated/checked the .env file with the correct variables.
# Every variable used in this file must be defined there, unless it has a default such as ${VAR:-value}.
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest # Image to be used
    container_name: tailscale-${SERVICE} # Name for local container management
    hostname: ${SERVICE} # Name used within your Tailscale environment
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the web interface on your local Tailnet - remove this line if not required
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
      #- TS_ACCEPT_DNS=true # Uncomment only if the service must resolve MagicDNS names - this replaces Docker DNS, so Compose service names no longer resolve
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./config:/config # Config folder used to store Tailscale files - you may need to change the path
      - ./ts/state:/var/lib/tailscale # Tailscale requirement - you may need to change the path
    devices:
      - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
    cap_add:
      - net_admin # Tailscale requirement
    #ports:
    #  - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT} # Binding the service port to the local network - may be removed if only exposure to your Tailnet is required
    # If any DNS issues arise, use your preferred DNS provider by uncommenting the config below
    #dns:
    #  - ${DNS_SERVER}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: always

  # Tailscale devices of the apps, named after the service and the app. To add an app, copy one of these blocks and see the README.
  tailscale-home:
    <<: *tailscale-app
    container_name: tailscale-${SERVICE}-home
    hostname: ${SERVICE}-home
    volumes:
      - ./ts/state-home:/var/lib/tailscale

  tailscale-settings:
    <<: *tailscale-app
    container_name: tailscale-${SERVICE}-settings
    hostname: ${SERVICE}-settings
    volumes:
      - ./ts/state-settings:/var/lib/tailscale

  tailscale-drive:
    <<: *tailscale-app
    container_name: tailscale-${SERVICE}-drive
    hostname: ${SERVICE}-drive
    volumes:
      - ./ts/state-drive:/var/lib/tailscale

  # Application
  application:
    image: ${IMAGE_URL} # Image to be used
    network_mode: service:tailscale # Sidecar configuration to route the service through Tailscale
    container_name: app-${SERVICE} # Name for local container management
    environment: # Variables are declared in .env file.
      - TZ=${TZ}
      - COZY_ADMIN_PASSPHRASE=${COZY_ADMIN_PASSPHRASE:?Set COZY_ADMIN_PASSPHRASE in .env} # Used once: the image stores its hash in the etc folder below
      - START_EMBEDDED_POSTFIX=false
      - COUCHDB_PROTOCOL=http
      - COUCHDB_HOST=couchdb
      - COUCHDB_PORT=5984
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    configs:
      - source: cozy-config
        target: /etc/cozy/cozy.yml
    volumes:
      - ./${SERVICE}-data/app/etc:/etc/cozy # Admin passphrase hash and vault keys
      - ./${SERVICE}-data/app/data:/var/lib/cozy/data # Files of all instances
    depends_on:
      tailscale:
        condition: service_healthy
      couchdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/status"] # Check if the service is responding
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always

  # Database
  couchdb:
    image: couchdb:3.3 # Major.minor tag, as the cozy-stack documentation uses
    container_name: app-${SERVICE}-db
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - ./${SERVICE}-data/db:/opt/couchdb/data
    ulimits:
      nofile: 65536
    # Healthcheck: the image defines none, so call the CouchDB endpoint with the curl that ships with the image.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5984/_up"] # Check if CouchDB is up
      interval: 10s # How often to perform the check
      timeout: 5s # Time to wait for the check to succeed
      retries: 5 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always
