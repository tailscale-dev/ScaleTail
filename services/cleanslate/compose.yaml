configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:3000"},
          "/auth":
          {"Proxy":"http://127.0.0.1:3001/auth"},
          "/v1/":
          {"Proxy":"http://127.0.0.1:8080/v1/"},
          "/v1alpha1/":
          {"Proxy":"http://127.0.0.1:8080/v1alpha1/"},
          "/v2/":
          {"Proxy":"http://127.0.0.1:8080/v2/"},
          "/console":
          {"Proxy":"http://127.0.0.1:8080/console"},
          "/healthz":
          {"Proxy":"http://127.0.0.1:8080/healthz"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
# Make sure you have updated/checked the .env file with the correct variables.
# Every variable used in this file must be defined there, unless it has a default such as ${VAR:-value}.
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest # Image to be used
    container_name: tailscale-${SERVICE} # Name for local container management
    hostname: ${SERVICE} # Name used within your Tailscale environment
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the web interface on your local Tailnet - remove this line if not required
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
      #- TS_ACCEPT_DNS=true # Uncomment only if the service must resolve MagicDNS names - this replaces Docker DNS, so Compose service names no longer resolve
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./config:/config # Config folder used to store Tailscale files - you may need to change the path
      - ./ts/state:/var/lib/tailscale # Tailscale requirement - you may need to change the path
    devices:
      - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
    cap_add:
      - net_admin # Tailscale requirement
    #ports:
    #  - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT} # Binding the service port to the local network - may be removed if only exposure to your Tailnet is required
    # If any DNS issues arise, use your preferred DNS provider by uncommenting the config below
    #dns:
    #  - ${DNS_SERVER}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: always

  # Clean Slate client (static web app)
  application:
    image: ${IMAGE_URL} # Image to be used
    network_mode: service:tailscale # Sidecar configuration to route the service through Tailscale
    container_name: app-${SERVICE} # Name for local container management
    environment: # Variables are declared in .env file.
      - TZ=${TZ}
    depends_on:
      tailscale:
        condition: service_healthy
    # The image defines no HEALTHCHECK, so check the web server with the wget that ships with busybox.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"] # Check if the web server is responding
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always

  # Hasura GraphQL engine (API and admin console)
  graphql:
    image: ${GRAPHQL_IMAGE_URL} # Image to be used
    network_mode: service:tailscale # Sidecar configuration to route the service through Tailscale
    container_name: app-${SERVICE}-graphql # Name for local container management
    environment: # Variables are declared in .env file.
      - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_GRAPHQL_ADMIN_SECRET:?Set HASURA_GRAPHQL_ADMIN_SECRET in .env}
      - HASURA_GRAPHQL_DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/postgres
      - 'HASURA_GRAPHQL_JWT_SECRET={"type":"HS256","key":"${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in .env}"}'
      - HASURA_GRAPHQL_CORS_DOMAIN=${HASURA_GRAPHQL_CORS_DOMAIN:-*}
      - HASURA_GRAPHQL_DEV_MODE=false
      - HASURA_GRAPHQL_ENABLE_CONSOLE=true
      - HASURA_GRAPHQL_ENABLED_LOG_TYPES=startup, http-log, webhook-log, websocket-log, query-log
    depends_on:
      tailscale:
        condition: service_healthy
      database:
        condition: service_healthy
    # The image defines no HEALTHCHECK, so call the Hasura health endpoint with the curl that ships with the image.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"] # Check if Hasura is running and connected to the database
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 60s # Time to wait before starting health checks
    restart: always

  # Clean Slate authentication server
  auth:
    image: ${AUTH_IMAGE_URL} # Image to be used
    network_mode: service:tailscale # Sidecar configuration to route the service through Tailscale
    container_name: app-${SERVICE}-auth # Name for local container management
    environment: # Variables are declared in .env file.
      - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_GRAPHQL_ADMIN_SECRET:?Set HASURA_GRAPHQL_ADMIN_SECRET in .env}
      - JWT_SIGNING_SECRET=${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in .env}
      - HASURA_HOST=127.0.0.1:8080 # Hasura shares the network of the tailscale container
    depends_on:
      graphql:
        condition: service_healthy
    # The image defines no HEALTHCHECK and ships no curl or wget, so call the health route with node.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/auth').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"] # Check if the server is responding
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always

  # PostgreSQL database
  database:
    image: ${DB_IMAGE_URL} # Image to be used
    container_name: app-${SERVICE}-db # Name for local container management
    environment: # Variables are declared in .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Point PGDATA to a subfolder inside the volume mount
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./${SERVICE}-data/db:/var/lib/postgresql/data
    # Database: check over TCP, because the first-start server accepts only socket connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"] # Check if PostgreSQL accepts connections
      interval: 5s # How often to perform the check
      timeout: 3s # Time to wait for the check to succeed
      retries: 10 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: always
