configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8080"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
# Make sure you have updated/checked the .env file with the correct variables.
# Every variable used in this file must be defined there, unless it has a default such as ${VAR:-value}.
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest # Image to be used
    container_name: tailscale-${SERVICE} # Name for local container management
    hostname: ${SERVICE} # Name used within your Tailscale environment
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the web interface on your local Tailnet - remove this line if not required
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
      #- TS_ACCEPT_DNS=true # Uncomment only if the service must resolve MagicDNS names - this replaces Docker DNS, so Compose service names no longer resolve
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./config:/config # Config folder used to store Tailscale files - you may need to change the path
      - ./ts/state:/var/lib/tailscale # Tailscale requirement - you may need to change the path
    devices:
      - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
    cap_add:
      - net_admin # Tailscale requirement
    #ports:
    #  - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT} # Binding the service port to the local network - may be removed if only exposure to your Tailnet is required
    # If any DNS issues arise, use your preferred DNS provider by uncommenting the config below
    #dns:
    #  - ${DNS_SERVER}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: always

  # Application
  application:
    image: ${IMAGE_URL} # Image to be used
    network_mode: service:tailscale # Sidecar configuration to route the service through Tailscale
    container_name: app-${SERVICE} # Name for local container management
    environment: # Variables are declared in .env file.
      - TZ=${TZ}
      - NGINX_PORT=8080 # nginx listens on 8080 here, so the optional ports block can use the same port on the host
      - BACKEND=127.0.0.1 # The api container shares the network of the tailscale container, so nginx reaches it on localhost
      - PORT=3000 # Port of the api container, which nginx proxies /api to
    depends_on:
      tailscale:
        condition: service_healthy
      api:
        condition: service_started # Not service_healthy: the image checks its health only after a five-minute interval, which would hold the web server back that long
    # Healthcheck: defined by the image (wget against the port in NGINX_PORT), so this file does not override it.
    restart: always

  # API
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest # Image to be used - keep it on the same release as the web image in IMAGE_URL
    network_mode: service:tailscale # Join the same network namespace, so nginx reaches the API on localhost
    container_name: app-${SERVICE}-api # Name for local container management
    environment: # Variables are declared in .env file.
      - TZ=${TZ}
      - PORT=3000
      - DATA_DIR=/data
      # Passkeys are bound to this exact host name and address, so they are built from the Tailnet address of the service.
      - RP_ID=${SERVICE}.${TAILNET_NAME:?Set TAILNET_NAME in .env}.ts.net
      - ORIGIN=https://${SERVICE}.${TAILNET_NAME:?Set TAILNET_NAME in .env}.ts.net
      - RP_NAME=${RP_NAME:-openGym}
      - FIRST_USER_ADMIN=${FIRST_USER_ADMIN:-}
      - ADMIN_UIDS=${ADMIN_UIDS:-}
      - INVITE_ONLY=${INVITE_ONLY:-}
      - ALLOW_GUEST=${ALLOW_GUEST:-}
      - PASSWORD_LOGIN=${PASSWORD_LOGIN:-}
      - DEFAULT_LANG=${DEFAULT_LANG:-}
    volumes:
      - ./${SERVICE}-data:/data # Accounts, passkeys, workouts, and the key that signs sessions - back this up
    depends_on:
      tailscale:
        condition: service_healthy
    # Healthcheck: defined by the image (wget against /api/health), so this file does not override it.
    restart: always
