configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:80"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

# Settings shared by the application, the queue worker and the scheduler, which run the same image.
x-invoiceninja-environment: &invoiceninja-environment
  TZ: ${TZ}
  APP_URL: https://${SERVICE}.${TAILNET_NAME:?Set TAILNET_NAME in .env}.ts.net
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_ENV: production # The image runs the database migrations and the first-run setup only in production
  APP_DEBUG: "false"
  REQUIRE_HTTPS: "false" # Tailscale Serve handles HTTPS and forwards plain HTTP to the application
  TRUSTED_PROXIES: "*"
  IS_DOCKER: "true"
  PDF_GENERATOR: snappdf # Renders PDFs with the Chrome that ships with the image
  FILESYSTEM_DISK: debian_docker # Stores uploads such as logos in /app/storage/app/public
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ninja
  DB_USERNAME: ninja
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "null"
  MAIL_MAILER: ${MAIL_MAILER}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME}

services:
# Make sure you have updated/checked the .env file with the correct variables.
# Every variable used in this file must be defined there, unless it has a default such as ${VAR:-value}.
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest # Image to be used
    container_name: tailscale-${SERVICE} # Name for local container management
    hostname: ${SERVICE} # Name used within your Tailscale environment
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the web interface on your local Tailnet - remove this line if not required
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
      #- TS_ACCEPT_DNS=true # Uncomment only if the service must resolve MagicDNS names - this replaces Docker DNS, so Compose service names no longer resolve
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./config:/config # Config folder used to store Tailscale files - you may need to change the path
      - ./ts/state:/var/lib/tailscale # Tailscale requirement - you may need to change the path
    devices:
      - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
    cap_add:
      - net_admin # Tailscale requirement
    #ports:
    #  - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT} # Binding the service port to the local network - may be removed if only exposure to your Tailnet is required
    # If any DNS issues arise, use your preferred DNS provider by uncommenting the config below
    #dns:
    #  - ${DNS_SERVER}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: always

  # Application: the web interface and the API, served by FrankenPHP
  application:
    image: ${IMAGE_URL} # Image to be used
    network_mode: service:tailscale # Sidecar configuration to route the service through Tailscale
    container_name: app-${SERVICE} # Name for local container management
    command: --port=80 --workers=2 # Flags for artisan octane:frankenphp, as in the upstream Compose file
    environment:
      <<: *invoiceninja-environment
      LARAVEL_ROLE: app
      # The first administrator, created on the first start only
      IN_USER_EMAIL: ${IN_USER_EMAIL:?Set IN_USER_EMAIL in .env}
      IN_PASSWORD: ${IN_PASSWORD:?Set IN_PASSWORD in .env}
    volumes:
      - ./${SERVICE}-data/storage:/app/storage # Uploads, logs and cache - owned by uid 999
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true # Restart this service when Compose restarts the sidecar, whose network it uses
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck: defined by the image (curl -f http://localhost/health), so this file does not override it.
    restart: always

  # Queue worker: sends emails and runs background jobs
  worker:
    image: ${IMAGE_URL} # Image to be used
    container_name: app-${SERVICE}-worker # Name for local container management
    command: --verbose --sleep=3 --tries=3 --max-time=3600 # Flags for artisan queue:work, as in the upstream Compose file
    environment:
      <<: *invoiceninja-environment
      LARAVEL_ROLE: worker
    volumes:
      - ./${SERVICE}-data/storage:/app/storage
    depends_on:
      application:
        condition: service_healthy
    # The image's check calls the web server, which runs only in the application container.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"] # Check if the queue worker is running
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always

  # Scheduler: runs recurring invoices, reminders and other scheduled tasks
  scheduler:
    image: ${IMAGE_URL} # Image to be used
    container_name: app-${SERVICE}-scheduler # Name for local container management
    # Runs schedule:work with the PHP command line, not with FrankenPHP as upstream does. Through FrankenPHP,
    # every scheduled task fails with: unknown command "artisan" for "frankenphp".
    # See https://github.com/invoiceninja/dockerfiles/issues/902
    command: ["php", "artisan", "schedule:work", "--verbose"]
    environment: *invoiceninja-environment
    volumes:
      - ./${SERVICE}-data/storage:/app/storage
    depends_on:
      application:
        condition: service_healthy
    # The image's check calls the web server, which runs only in the application container.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"] # Check if the scheduler is running
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always

  # Database
  db:
    image: mysql:8.4
    container_name: app-${SERVICE}-db # Name for local container management
    environment:
      - MYSQL_DATABASE=ninja
      - MYSQL_USER=ninja
      - MYSQL_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - ./${SERVICE}-data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u ninja --password=\"$$MYSQL_PASSWORD\" --silent"] # Check if MySQL accepts TCP connections
      interval: 10s # How often to perform the check
      timeout: 5s # Time to wait for the check to succeed
      retries: 5 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always

  # Cache, sessions and job queue
  redis:
    image: redis:8-alpine
    container_name: app-${SERVICE}-redis # Name for local container management
    # Logs each write to an append-only file and syncs it every second. With the default snapshots only,
    # a crash could lose queued jobs, such as emails that still have to be sent.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./${SERVICE}-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # Check if Redis answers
      interval: 10s # How often to perform the check
      timeout: 5s # Time to wait for the check to succeed
      retries: 5 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: always
