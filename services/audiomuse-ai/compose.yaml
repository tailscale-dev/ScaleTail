configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8000"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
# Make sure you have updated/checked the .env file with the correct variables.
# Every variable used in this file must be defined there, unless it has a default such as ${VAR:-value}.
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest # Image to be used
    container_name: tailscale-${SERVICE} # Name for local container management
    hostname: ${SERVICE} # Name used within your Tailscale environment
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the web interface on your local Tailnet - remove this line if not required
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
      #- TS_ACCEPT_DNS=true # Uncomment only if the service must resolve MagicDNS names - this replaces Docker DNS, so Compose service names no longer resolve
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./config:/config # Config folder used to store Tailscale files - you may need to change the path
      - ./ts/state:/var/lib/tailscale # Tailscale requirement - you may need to change the path
    devices:
      - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
    cap_add:
      - net_admin # Tailscale requirement
    #ports:
    #  - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT} # Binding the service port to the local network - may be removed if only exposure to your Tailnet is required
    # If any DNS issues arise, use your preferred DNS provider by uncommenting the config below
    #dns:
    #  - ${DNS_SERVER}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: always

  # Application: the web interface and API
  application:
    image: ${IMAGE_URL} # Image to be used - pinned, see the comment in .env
    network_mode: service:tailscale # Sidecar configuration to route the service through Tailscale
    container_name: app-${SERVICE} # Name for local container management
    environment: # Variables are declared in .env file.
      - SERVICE_TYPE=flask # Runs the web interface and API
      - POSTGRES_HOST=127.0.0.1 # The db container shares this network namespace
      - POSTGRES_PORT=5432
      - POSTGRES_USER=audiomuse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=audiomusedb
      - TZ=${TZ}
    volumes:
      - ./${SERVICE}-data/app/temp:/app/temp_audio # Temporary audio files
      - ./${SERVICE}-data/app/plugins:/app/plugin/installed # Installed plugins, reused across restarts
      - ./${SERVICE}-data/app/backup:/app/backup # Backups made in the web interface
    depends_on:
      tailscale:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/api/health"] # Check if the service is responding
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 60s # Time to wait before starting health checks
    restart: always

  # Worker: runs the analysis and clustering jobs that the web interface queues in the database
  worker:
    image: ${IMAGE_URL} # Same image as the application, so both always run the same version
    network_mode: service:tailscale # Same network namespace, to reach the database and the media server
    container_name: app-${SERVICE}-worker # Name for local container management
    environment:
      - SERVICE_TYPE=worker # Runs the queue workers instead of the web interface
      - POSTGRES_HOST=127.0.0.1 # The db container shares this network namespace
      - POSTGRES_PORT=5432
      - POSTGRES_USER=audiomuse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=audiomusedb
      - TZ=${TZ}
    volumes:
      - ./${SERVICE}-data/worker/temp:/app/temp_audio # Temporary audio files
      - ./${SERVICE}-data/worker/plugins:/app/plugin/installed # Installed plugins, reused across restarts
    depends_on:
      tailscale:
        condition: service_healthy
      db:
        condition: service_healthy
    # The image has no HEALTHCHECK, and the worker has no endpoint. Check the queue worker process, with a fixed pattern because the process name is python.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "taskqueue.worker --queue default"] # Check if the queue worker is running
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 60s # Time to wait before starting health checks
    restart: always

  # Database
  db:
    image: postgres:15-alpine # Upstream supports PostgreSQL 15 and warns that other versions can cause errors
    network_mode: service:tailscale # Join the same network namespace to be accessible via localhost
    container_name: app-${SERVICE}-db # Name for local container management
    command: ["postgres", "-c", "listen_addresses=localhost"] # Listen on localhost only, so the Tailnet cannot reach the database
    environment:
      - POSTGRES_USER=audiomuse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=audiomusedb
      - TZ=${TZ}
    volumes:
      - ./${SERVICE}-data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U audiomuse -d audiomusedb"] # Check if PostgreSQL accepts connections over TCP
      interval: 10s # How often to perform the check
      timeout: 5s # Time to wait for the check to succeed
      retries: 5 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always
