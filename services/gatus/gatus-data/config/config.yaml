# Starter configuration of Gatus. The repository tracks this file, so leave it as it is.
# Put your own endpoints in a file of your own in this folder, such as endpoints.yaml.
# Gatus reads every YAML file in this folder and merges them.
# All options: https://github.com/TwiN/gatus#configuration

storage:
  type: sqlite # Keep the results and uptime history across restarts
  path: /data/data.db

endpoints:
  - name: Gatus
    group: Self
    url: "http://127.0.0.1:8080/health" # Gatus checks itself
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"

  # Example for your own file: a web service on another device in your Tailnet, by its Tailscale IP address
