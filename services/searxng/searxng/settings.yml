# Only the settings that this stack changes. SearXNG takes every other setting from its default settings,
# so engine changes in new SearXNG releases apply without editing this file.
# See https://docs.searxng.org/admin/settings/settings.html
use_default_settings: true

server:
  # Set from ${SEARXNG_SECRET} in .env (compose.yaml passes it to the container).
  secret_key: ${SEARXNG_SECRET}
